# DATA
dataset:
  dataset_path: "erikpinhasov/landcover_dataset"
  include_background: False
  num_workers: 8
  pin_memory: True

# PROJECT DIRECTORIES
directories:
  models: models
  pretrained: models/pretrained_models
  logs: models/logs
  checkpoints: models/logs/checkpoints
  results: results

# TRAINING SETTINGS
training:
  max_epochs: 50
  weighting_strategy: "raw" # Options: "none", "balanced", "max", "sum", or "raw"
  alpha: 0.7
  id2label:
    0: "bareland"
    1: "rangeland"
    2: "developed space"
    3: "road"
    4: "tree"
    5: "water"
    6: "agriculture land"
    7: "buildings"

# CALLBACKS SETTINGS
callbacks:
  early_stop_patience: 5
  early_stop_monitor: "val/loss"
  early_stop_mode: "min"
  save_model_monitor: "val/mean_iou"
  save_model_mode: "max"

hparams:
  learning_rate: 2e-5
  weight_decay: 1e-3
  batch_size: 16
  backbone: "b0"

loggers:
  project_name: "landcover-seg"
  wandb: True
  wandb_watch: True
  wandb_log: "all"
  wandb_log_freq: 500
  wandb_log_graph: False
  tags: ["segmentation", "landcover"]
  notes: "Fine-Tune SegFormer with landcover dataset"
